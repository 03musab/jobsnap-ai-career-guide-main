name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Analyze code and dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript, python
          queries: security-extended

      - name: Analyze with CodeQL
        id: codeql
        uses: github/codeql-action/analyze@v4
        with:
          output: ${{ runner.temp }}/codeql-results
          upload: never

      - name: Generate Markdown security report
        if: always()
        env:
          CODEQL_SARIF_DIR: ${{ steps.codeql.outputs.sarif-output }}
        run: node .github/scripts/generate-security-report.mjs security-report.md

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_id }}
          path: |
            security-report.md
            ${{ steps.codeql.outputs.sarif-output }}
          if-no-files-found: warn
          retention-days: 30
